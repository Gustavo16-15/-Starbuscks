<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Starbuscks</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <img src="img/logo.png" alt="logo do Starbucks">


    <div class="conteudo">
        
        <div class="caixa-texto">
            <h1>It's not justa Coffee It's <Span>Starbucks</Span></h1>
            <p>Lorem, ipsum dolor sit amet consectetur adipisicing elit. Inventore ducimus a aut id perferendis
                laboriosam
                voluptates blanditiis ipsa sint consequuntur fugiat, quo dicta ad vitae repudiandae error at quia
                repellendus?
            </p>
            <button>Clique aqui</button>
        </div>
        
        <div class="caixa-imagem">
            <img  class="imagem-copo" src="img/img1.png" alt="Copo principal">
        </div>
    
    </div>

    <div class="menu">
        <img class="botao-menu" src="img/thumb1.png" alt="thumb1" onclick="mudarImagem('img/img1.png');trocaFundo('hsl(158, 67%, 27%)')">
        <img class="botao-menu" src="img/thumb2.png" alt="thumb2" onclick="mudarImagem('img/img2.png');trocaFundo('hsl(315, 100%, 81%, 1.00)')">
        <img class="botao-menu" src="img/thumb3.png" alt="thumb3" onclick="mudarImagem('img/img3.png');trocaFundo('hsla(303, 57%, 56%, 1.00)')">
    </div>
    <div class="circulo"></div>

</html>
